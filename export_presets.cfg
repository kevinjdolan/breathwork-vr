[preset.0]
name="Meta Quest"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="experiences/catalog.json"
exclude_filter="audio/*,tests/*,verification/*,scripts/build_scene.gd,build/*,experiences/*/review.gd,experiences/*/DESIGN.md,skills/*"
export_path="build/BreathworkVR.apk"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android"
gradle_build/export_format=0
gradle_build/min_sdk="29"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=7
version/name="2.0.0"
package/unique_name="com.kevin.breathworkvr"
package/name="Breathwork VR"
package/signed=true
keystore/debug=".tools/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
screen/immersive_mode=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/hand_tracking=1
meta_xr_features/hand_tracking_frequency=1
meta_xr_features/quest_1_support=false
meta_xr_features/quest_2_support=true
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=false
permissions/internet=false
permissions/record_audio=false
